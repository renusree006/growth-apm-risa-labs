<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Center · CampusFest sponsorship</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
VOICE   calm operator's console: a sponsorship sales desk, not a marketing page
IDEA    a ledger: one joined strip of figures, rows with hairlines, tables that read like statements
PICTURE the KPI ledger strip and the pace chart carry the first screen; everything else stays quiet
COLOUR  white surfaces on a cool neutral canvas, ink #15171C, one blue (#2554E8), orange only for "cold"
TYPE    Geist for everything, tabular figures for numbers; 4 sizes (28 / 20 / 14 / 12.5), sentence case only
*/
:root{
  --bg:#F6F7F9;--card:#FFFFFF;--ink:#15171C;--ink2:#5B6270;--ink3:#8A909C;--line:#E4E7EC;--line2:#EEF0F3;
  --brand:#2554E8;--brand-d:#1A3FB8;--brand-soft:#EEF3FE;--brand-line:#D3DEFB;
  --warm:#2554E8;--cold:#E2762F;
  --ok:#137A4B;--amber:#9A5B00;--red:#BF3A30;--ok-soft:#E8F5EE;--amber-soft:#FBF2E1;--red-soft:#FCECEA;--gray-soft:#F0F2F5;--blue-soft:#EEF3FE;--orange-soft:#FDF0E7;
  --r:12px;--ring:0 0 0 3px rgba(37,84,232,.18);--sh:none;--navy:#15171C;
  --font:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:14px/1.55 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"tnum" 1,"ss01" 1}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:#D9E3FD}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;color:var(--ink2)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.mark{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:-.3px}
.brand b{display:block;color:var(--ink);font-size:14.5px;font-weight:600;letter-spacing:-.2px;line-height:1.25}.brand span{font-size:12px;color:var(--ink3)}
.nav-l{font-size:12px;color:var(--ink3);padding:4px 10px 6px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink2);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;text-align:left;width:100%;line-height:1.3}
.nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.nav button small{display:none}
.nav button:hover{background:var(--gray-soft);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand-d);font-weight:600}.nav button.on svg{opacity:1}
.nav button:focus-visible{outline:none;box-shadow:var(--ring)}
.side .foot{margin-top:auto;font-size:12px;line-height:1.55;color:var(--ink3);padding:12px 10px 0;border-top:1px solid var(--line2)}.side .foot b{color:var(--ink2);font-weight:600}
.main{min-width:0}.app>*{min-width:0}
.bar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.88);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:14px 36px;flex-wrap:wrap;min-height:68px}
.bar h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.4px;line-height:1.25}.bar .sub{color:var(--ink3);font-size:13px}
.tm{margin-left:auto;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 14px}
.tm label{font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tm input[type=range]{width:150px;accent-color:var(--brand);height:4px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.pill.live{background:var(--ok-soft);color:var(--ok)}.pill.replay{background:var(--amber-soft);color:var(--amber)}
main{padding:28px 36px 100px;max-width:1320px;margin:0 auto}
.banner{display:flex;align-items:center;gap:12px;background:var(--amber-soft);border:1px solid #EFD9AE;color:#6F4300;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:13.5px;flex-wrap:wrap}

/* page summary (replaces the old hero box) */
.hero{margin:0 0 24px;padding:0;background:none;border:0}
.hero .eyebrow{display:none}
.lede{font-size:16.5px;line-height:1.55;font-weight:400;letter-spacing:-.1px;max-width:880px;margin:0;color:var(--ink)}
.lede b{font-weight:600;color:var(--ink)}.lede .mut{color:var(--ink2)}

/* ---------- layout ---------- */
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2b{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.g12{grid-template-columns:minmax(260px,.8fr) minmax(0,2fr)}
.mt{margin-top:16px}.mt2{margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ch h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--ink3)}.ch .sub{margin-top:3px;max-width:720px}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--ink2)}
.tag{font-size:12px;color:var(--ink3)}

/* the ledger strip: four KPIs joined into one panel */
.grid.g4{gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid.g4>.card{border:0;border-radius:0;border-left:1px solid var(--line2);padding:20px 22px 18px}
.grid.g4>.card:first-child{border-left:0}
.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.9px;line-height:1.1;margin:10px 0 6px}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink3);letter-spacing:0}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.meter{height:4px;border-radius:4px;background:var(--gray-soft);margin-top:14px;overflow:hidden}.meter i{display:block;height:100%;border-radius:4px;background:var(--brand)}

.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px}.dot.warm{background:var(--warm)}.dot.cold{background:var(--cold)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.7}
.chip.ok,.chip.scale,.chip.won{background:var(--ok-soft);color:var(--ok)}.chip.amber,.chip.change{background:var(--amber-soft);color:var(--amber)}.chip.red,.chip.stop{background:var(--red-soft);color:var(--red)}.chip.collecting,.chip.closed,.chip.mute{background:var(--gray-soft);color:var(--ink2)}.chip.warm{background:var(--blue-soft);color:var(--brand-d)}.chip.cold{background:var(--orange-soft);color:#9C4A12}.chip.assume{background:var(--amber-soft);color:var(--amber)}.chip.data{background:var(--brand-soft);color:var(--brand-d)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:0 10px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 10px;border-top:1px solid var(--line2);vertical-align:middle}
tr:nth-child(2) td{border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
table tr:hover td{background:#FAFBFC}tr.hl td{background:var(--brand-soft)}
.tw{overflow-x:auto}td b{font-weight:600}

/* warm vs cold comparison */
.cmp{display:grid;grid-template-columns:130px 1fr 1fr;gap:12px 24px;align-items:center}.cmp .hd{font-size:13px;font-weight:500;display:flex;align-items:center;color:var(--ink2)}.cmp .lab{font-size:13.5px;color:var(--ink2)}
.cell{display:flex;align-items:center;gap:10px}.cell .tr{flex:1;height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden}.cell .tr i{display:block;height:100%;border-radius:4px;min-width:2px}.cell b{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.bw{background:var(--warm)}.bc{background:var(--cold)}
.stat{display:flex;gap:40px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2);flex-wrap:wrap}.stat div{font-size:12.5px;color:var(--ink2)}.stat b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.4px;font-weight:600;margin-bottom:1px}

/* ---------- tabs, toolbar, buttons, inputs ---------- */
.seg{display:inline-flex;gap:22px;border-bottom:1px solid var(--line);background:none;padding:0;border-radius:0}
.seg button{border:0;background:none;padding:8px 0 11px;cursor:pointer;font-weight:500;color:var(--ink3);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--ink);border-bottom-color:var(--brand);box-shadow:none;background:none}
.seg button:focus-visible{outline:none;box-shadow:var(--ring);border-radius:4px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line)}.toolbar .seg{border-bottom:0}.toolbar .fill{flex:1}.toolbar>.btn,.toolbar>button{margin-bottom:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:34px;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{border-color:#C9CED7;background:#FAFBFC}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:7px;min-height:30px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}.btn.ghost:hover{background:var(--gray-soft)}
.btn.danger{color:var(--red)}.btn[disabled]{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none;color:inherit}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0;max-width:100%;min-height:36px}
select{padding-right:28px}
input[type=number]{width:88px}textarea{width:100%;resize:vertical;line-height:1.55}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
input.as{border-color:#ECD9B4;background:#FFFBF3}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink3)}.small{font-size:13px}.hide{display:none!important}.fill{flex:1}

/* ---------- findings, results, assumptions ---------- */
.finding{display:grid;grid-template-columns:22px 1fr auto;gap:14px;padding:18px 0;border-top:1px solid var(--line2);align-items:start}.finding:first-child{border-top:0;padding-top:0}
.finding .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ic.bad{background:var(--red-soft);color:var(--red)}.ic.warn{background:var(--amber-soft);color:var(--amber)}.ic.good{background:var(--ok-soft);color:var(--ok)}
.finding h4{margin:0 0 4px;font-size:14.5px;font-weight:600;letter-spacing:-.15px}.finding p{margin:0;color:var(--ink2);font-size:13.5px;max-width:780px}.finding .ev{margin-top:8px}.finding .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.res{border-radius:var(--r);padding:20px 22px;border:1px solid var(--line);background:#fff}
.res.dark{background:var(--brand-soft);border-color:var(--brand-line);color:var(--ink)}
.res.accent{background:#fff;border-color:var(--line)}
.res .eyebrow{color:var(--ink2)}.res.dark .eyebrow{color:var(--brand-d)}
.res .big{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1.1;margin:10px 0 6px}.res.dark .big{color:var(--brand-d)}
.res .s{font-size:13px;color:var(--ink2)}.res.dark .s{color:var(--ink2)}.res .s b{color:var(--ink);font-weight:600}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 64px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.arow.h{border-top:0;padding-bottom:4px}.arow.h div{font-size:12px;font-weight:500;color:var(--ink3)}
.arow .l{font-size:13.5px}.arow .l small{display:block;color:var(--ink3);font-size:12px}.arow .u{display:flex;align-items:center;gap:4px}.arow .u.act{font-size:13px;color:var(--ink3);justify-content:flex-start;font-variant-numeric:tabular-nums}
.agrp{font-size:13px;font-weight:600;color:var(--ink);margin:20px 0 4px}
.torn{display:grid;grid-template-columns:1fr;gap:2px 0}.torn .tl{font-size:13.5px;margin-top:14px}.torn .tl small{color:var(--ink3);font-size:12px;margin-left:6px}
.torn .tb{position:relative;height:34px}.torn .tb .rng{position:absolute;top:12px;height:10px;border-radius:3px;background:#C8D6FA}.torn .tb .mid{position:absolute;top:6px;width:2px;height:22px;background:var(--ink)}.torn .tb span{position:absolute;top:8px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- bets ---------- */
.bet{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:16px;align-items:start;padding:20px 0;border-top:1px solid var(--line2)}.bet:first-child{border-top:0;padding-top:2px}
.rank{width:28px;height:28px;border-radius:7px;background:var(--brand-soft);color:var(--brand-d);font-weight:600;font-size:13px;display:grid;place-items:center}.rank.opt{background:var(--gray-soft);color:var(--ink2)}
.bet h4{margin:0;font-size:15px;font-weight:600;letter-spacing:-.15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bet .m{font-size:13px;color:var(--ink2);margin-top:4px}
.score{font-size:22px;font-weight:600;letter-spacing:-.5px;text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}.score small{display:block;font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-top:2px}
.read{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}.rule{font-size:12.5px;color:var(--ink3);margin-top:5px}
details.more>summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:500;margin-top:10px;list-style:none;display:inline-block}details.more>summary::-webkit-details-marker{display:none}details.more>summary:after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:0 0 3px 8px}details.more[open]>summary:after{transform:rotate(-135deg);margin-bottom:-1px}
.ed{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px}.ed label{font-size:12px;color:var(--ink2);display:block;margin-bottom:4px;font-weight:500}.ed input,.ed select{width:100%}

/* ---------- tasks ---------- */
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{background:#EFF1F4;border-radius:10px;padding:10px;min-height:150px}
.col h5{margin:2px 4px 10px;font-size:13px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}
.task{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.task .tt{font-weight:500;font-size:13.5px;line-height:1.4}
.task .meta{font-size:12.5px;color:var(--ink2);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task.copilot{background:#FBFCFF;border-color:var(--brand-line)}.task .ai{font-size:12px;color:var(--brand-d);font-weight:500;margin-top:8px}.task .acts{display:flex;gap:4px;margin-top:10px}

/* ---------- AI analyst ---------- */
.chat{max-width:860px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:540px}
.chat-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chat-h h3{margin:0;font-size:15px;font-weight:600}.chat-h select{max-width:160px}
.msgs{flex:1;overflow:auto;padding:4px 2px 12px;position:relative}
.msg{margin:18px 0;display:flex;gap:12px}
.msg .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;flex:none;margin-top:1px}
.msg .bd{min-width:0;flex:1;line-height:1.6;font-size:14px}
.msg.u{justify-content:flex-end}.msg.u .bd{flex:none;max-width:80%;background:#E9EDF4;color:var(--ink);border-radius:14px 14px 4px 14px;padding:9px 14px}
.msg ul{margin:6px 0 4px;padding-left:20px}.msg li{margin:4px 0}.msg .bd>div{margin:3px 0}.msg .src{color:var(--ink3);font-size:12.5px;margin-top:8px}
.how{margin-top:10px}.how summary{cursor:pointer;color:var(--ink3);font-size:12.5px;list-style:none}.how summary::-webkit-details-marker{display:none}
.how code{display:block;font-size:12px;background:var(--gray-soft);padding:4px 8px;border-radius:6px;margin-top:4px;word-break:break-all;color:var(--ink2);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.prop{border:1px solid var(--brand-line);background:#FAFBFF;border-radius:10px;padding:13px 15px;margin:10px 0}.prop .tt{font-weight:600}
.welcome{padding:28px 2px 6px}.welcome h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.5px}.welcome p{margin:0;color:var(--ink2);max-width:620px}
.sug{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0}
.sug button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500}
.sug button:hover{border-color:var(--brand-line);background:#FAFBFF}.sug button small{display:block;color:var(--ink3);font-weight:400;margin-top:2px;font-size:12.5px}
.composer{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.composer:focus-within{border-color:var(--brand);box-shadow:var(--ring)}
.composer textarea{border:0;flex:1;min-height:24px;max-height:120px;padding:8px 0;outline:none;box-shadow:none}
.composer .btn{border-radius:8px;padding:7px 16px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin:0 2px;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25}}

/* ---------- drawer, forms, notes ---------- */
.modal{position:fixed;inset:0;background:rgba(21,23,28,.32);z-index:70;display:flex;justify-content:flex-end}
.modal .box{background:#fff;width:min(480px,100%);height:100%;padding:28px;overflow:auto;box-shadow:-16px 0 40px rgba(21,23,28,.12)}
.modal h3{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.3px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:14px 0 5px}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea{width:100%}.f .row{margin-top:20px}
.note{font-size:13px;color:var(--ink2);background:#F8F9FB;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;line-height:1.55}
.leg{display:flex;gap:18px;font-size:12.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}.leg i{display:inline-block;width:14px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
svg text{font-family:var(--font)}.chartwrap{width:100%}
.empty{padding:28px;text-align:center;color:var(--ink3)}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:5px 0;font-size:13.5px;color:var(--ink2)}

/* ---------- outreach ---------- */
.mailprev{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff}.mailprev .row{margin-top:12px;align-items:center}

function emptyChanges() {
  return { brands: [], opps: [], history: [], interactions: [], qualification: [], tasks: [], oppAttrs: {}, bets: {}, scenario: null, outreach: null, today: null, log: [], seq: 1 };

// ---------- store: seed + user changes, never mutating the seed ----------
function core(seed, ch) {
  ch = ch || emptyChanges();
  const S = { seed, ch };
  S.event = Object.assign({}, seed.event, { startT: T(seed.event.start), endT: T(seed.event.end) });
  S.histEndT = T(seed.event.historyEnd + 'T23:59:59');
  S.histStartT = T(seed.event.historyStart + 'T00:00:00');
  S.todayT = ch.today ? T(ch.today) : S.histEndT;
  S.campaigns = seed.campaigns; S.campById = Object.fromEntries(S.campaigns.map(c => [c.id, c]));
  S.brands = seed.brands.concat(ch.brands.map(b => Object.assign({}, b, { added: true })));
  S.brandById = Object.fromEntries(S.brands.map(b => [b.id, b]));
  S.contacts = seed.contacts; S.contactById = Object.fromEntries(S.contacts.map(c => [c.id, c]));
  const stamp = (arr, addedFlag, tf) => arr.map((x, i) => Object.assign({}, x, { t: T(x[tf]), added: addedFlag, _i: i }));
  S.interactions = stamp(seed.interactions, false, 'at').concat(stamp(ch.interactions, true, 'at')).sort((a, b) => a.t - b.t || (a.added - b.added) || a._i - b._i);
  S.history = stamp(seed.history, false, 'at').concat(stamp(ch.history, true, 'at')).sort((a, b) => a.t - b.t || (a.added - b.added) || a._i - b._i);
  S.qual = stamp(seed.qualification, false, 'at').concat(stamp(ch.qualification, true, 'at')).sort((a, b) => a.t - b.t || (a.added - b.added) || a._i - b._i);
  S.opps = seed.opps.map(o => Object.assign({}, o, { t: T(o.createdAt), added: false })).concat(ch.opps.map(o => Object.assign({}, o, { t: T(o.createdAt), added: true })));
  S.oppById = Object.fromEntries(S.opps.map(o => [o.id, o]));
  S.histByOpp = {}; S.history.forEach(h => (S.histByOpp[h.opp] = S.histByOpp[h.opp] || []).push(h));
  S.targets = seed.targets.map(x => Object.assign({}, x, { t: T(x.at) })).sort((a, b) => a.t - b.t);
  S.tasks = ch.tasks;
  S.bets = BETS_DEFAULT.map(b => Object.assign({}, b, ch.bets[b.id] || {}));
  S.scenario = ch.scenario || JSON.parse(JSON.stringify(SCEN_DEFAULT));
  return S;
}

function oppAt(S, o, t) {
  const rows = (S.histByOpp[o.id] || []).filter(h => h.t <= t);
  const last = rows[rows.length - 1];
  const brand = S.brandById[o.brand], camp = S.campById[o.camp];
  const stageT = {}; rows.forEach(r => { if (!(r.stage in stageT)) stageT[r.stage] = r.t; });
  const stage = last ? last.stage : 'prospecting';
  const won = stage === 'partner_confirmed';
  return {
    id: o.id, name: o.name, brand: o.brand, brandName: brand ? brand.name : '?', industry: brand ? brand.industry : '?', camp: o.camp, campaign: camp ? camp.name : '?',
    channel: camp ? camp.channel : '?', group: camp ? camp.group : '?', support: o.support, createdT: o.t, stage, won,
    proposed: last ? last.proposed : 0, confirmed: last ? last.confirmed : 0, value: won ? (last.confirmed || last.proposed) : (last ? last.proposed : 0),
    owner: last ? last.owner : (brand ? brand.owner : ''), lastT: last ? last.t : o.t, stageT, ever: new Set(rows.map(r => r.stage)),
    open: STAGES.indexOf(stage) >= 0 && !won, closed: stage === 'lost' || stage === 'withdrawn', attrs: (S.ch.oppAttrs[o.id] || {}), added: !!o.added, contact: o.contact,
  };
}

function view(S, t) {
  const V = { S, t: t == null ? S.todayT : t };
  V.interactions = S.interactions.filter(x => x.t <= V.t);
  V.opps = S.opps.filter(o => o.t <= V.t).map(o => oppAt(S, o, V.t));
  V.oppById = Object.fromEntries(V.opps.map(o => [o.id, o]));
  const q = {}; S.qual.forEach(x => { if (x.t <= V.t) q[x.brand] = x; });
  V.qualByBrand = q;
  V.target = (() => { let cur = S.targets[0]; S.targets.forEach(x => { if (x.t <= V.t) cur = x; }); return cur; })();
  V.opps.forEach(o => { o.health = health(S, o, V.t); o.ageDays = (V.t - o.createdT) / DAY; o.sinceDays = (V.t - o.lastT) / DAY; });
  return V;
}

// ---------- baseline stats from ORIGINAL data only (so edits never change benchmarks) ----------
function baselineStats(seed) {
  const S = core(seed, null); const V = { S, t: S.histEndT };
  const opps = S.opps.map(o => oppAt(S, o, S.histEndT));
  const won = opps.filter(o => o.won);
  const avgDeal = won.reduce((a, o) => a + o.confirmed, 0) / won.length;
  const cashVal = won.filter(o => o.support === 'cash').reduce((a, o) => a + o.confirmed, 0);
  const signed = won.reduce((a, o) => a + o.confirmed, 0);
  const clock = {};
  ['contacted', 'proposal_sent', 'negotiating', 'partner_confirmed'].forEach(st => { clock[st] = Math.round(won.reduce((a, o) => a + (o.stageT[st] - o.createdT) / DAY, 0) / won.length); });
  const stageWin = {};
  ['warm', 'cold', 'all'].forEach(g => {
    stageWin[g] = {};
    ['contacted', 'proposal_sent', 'negotiating'].forEach(st => {
      const rs = opps.filter(o => (g === 'all' || o.group === g) && o.ever.has(st));
      stageWin[g][st] = { n: rs.length, won: rs.filter(o => o.won).length, p: rs.length ? rs.filter(o => o.won).length / rs.length : 0 };
    });
  });
  const inbound = S.interactions.filter(x => x.type === 'web_inbound');
  const inboundBrands = uniq(inbound.map(x => x.brand)).length;
  const inboundWeeks = (Math.max(...inbound.map(x => x.t)) - Math.min(...inbound.map(x => x.t))) / DAY / 7;
  return { avgDeal, cashShare: cashVal / signed, signed, deals: won.length, clock, stageWin, inboundPerWeek: inboundBrands / inboundWeeks, finalOpps: opps };
}

function build(seed, ch) { const S = core(seed, ch); S.stats = baselineStats(seed); return S; }

function health(S, o, t) {
  if (o.won) return 'won';
  if (!o.open) return 'closed';
  const age = (t - o.createdT) / DAY, since = (t - o.lastT) / DAY;
  const nxt = STAGES[STAGES.indexOf(o.stage) + 1];
  const behind = age - (S.stats ? S.stats.clock[nxt] : 0);
  if (since >= 14) return 'red';
  if (behind > 3) return 'amber';
  return 'ok';
}

function funnel(V, by) {

  const get = k => acc[k] || (acc[k] = { key: k, label: labelOf[by](k), brands: new Set(), attempts: new Set(), replied: new Set(), meet: new Set(), opps: 0, proposal: 0, negot: 0, won: 0, wonValue: 0, cash: 0, brandsWon: new Set(), optOuts: 0 });
  V.interactions.forEach(x => {
    const c = S.campById[x.camp]; const b = S.brandById[x.brand]; if (!c || !b) return;
    const k = by === 'industry' ? b.industry : keyC(c); const a = get(k);
    a.brands.add(x.brand); if (ROOT.has(x.type)) a.attempts.add(x.attempt); if (x.type === 'replied') a.replied.add(x.brand); if (x.type === 'meeting_held') a.meet.add(x.brand); if (x.type === 'opt_out') a.optOuts++;

    if (o.won) { a.won++; a.wonValue += o.confirmed; a.brandsWon.add(o.brand); if (o.support === 'cash') a.cash += o.confirmed; }

    key: a.key, label: a.label, touched: a.brands.size, attempts: a.attempts.size, replied: a.replied.size, meetings: a.meet.size, opps: a.opps, proposals: a.proposal, negotiating: a.negot, won: a.won,
    wonValueL: r2(L(a.wonValue)), cashValueL: r2(L(a.cash)), avgDealL: a.won ? r2(L(a.wonValue / a.won)) : null, brandsWon: a.brandsWon.size, optOuts: a.optOuts,
    replyRate: pct(a.replied.size, a.brands.size), meetingRate: pct(a.meet.size, a.brands.size), oppWinRate: pct(a.won, a.opps), brandWinRate: pct(a.brandsWon.size, a.brands.size), winsPer100Attempts: a.attempts.size ? r2(100 * a.won / a.attempts.size) : null,
  })).sort((x, y) => (by === 'group' ? (x.key === 'warm' ? -1 : 1) : (y.wonValueL - x.wonValueL || y.touched - x.touched)));
}

function pace(V) {
  const S = V.S, out = [];
  const planTarget = runScenario(S, S.scenario.base).signed;
  for (let k = 12; k >= 0; k--) {
    const tk = S.event.startT - k * 7 * DAY, shown = tk <= V.t;
    let deals = null, value = null;
    if (shown) { const opps = S.opps.filter(o => o.t <= tk).map(o => oppAt(S, o, tk)).filter(o => o.won); deals = opps.length; value = opps.reduce((a, o) => a + o.confirmed, 0); }
    out.push({ k, date: day(tk), shown, deals, valueL: value == null ? null : r2(L(value)), planL: r2(L(planTarget * PLAN_PACE[k])), planShare: PLAN_PACE[k] });
  }
  return out;
}

function stalled(V, level) {
  return V.opps.filter(o => (level ? o.health === level : o.health === 'red' || o.health === 'amber'))
    .map(o => ({ id: o.id, brand: o.brandName, campaign: o.campaign, group: o.group, stage: o.stage, health: o.health, proposedL: r2(L(o.proposed)), owner: o.owner, daysSinceChange: Math.round(o.sinceDays), ageDays: Math.round(o.ageDays) }))
    .sort((a, b) => (a.health === b.health ? b.daysSinceChange - a.daysSinceChange : a.health === 'red' ? -1 : 1));
}

function runScenario(S, p) {
  const touches = p.touches.intro + p.touches.referral + p.touches.inbound;
  const warmDeals = ['intro', 'referral', 'inbound'].reduce((a, k) => a + p.touches[k] * p.yields[k], 0);
  const deals = warmDeals + (+p.coldDeals || 0);
  const avg = +p.avgDeal || S.stats.avgDeal, share = p.cashShare != null && p.cashShare !== '' ? +p.cashShare : S.stats.cashShare, tier = Math.min(p.tierDeals || 0, deals);
  const signed = (deals - tier) * avg + tier * p.tierValue;
  const cashType = signed * share;
  return { touches, warmDeals: r2(warmDeals), coldDeals: +p.coldDeals || 0, cashSharePct: r1(100 * share), deals: r2(deals), yield: r2(warmDeals / touches), avgDealL: r2(L(signed / deals)), signed, signedL: r2(L(signed)), cashTypeL: r2(L(cashType)), collectedL: r2(L(cashType * p.collect)), collectPct: p.collect };
}

function betScores(S) {

<script>/* Outreach module — pure logic (no DOM): CSV recipients, personalised emails, follow-up schedule,
